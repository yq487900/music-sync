<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>网易云扫码登录</title>
<style>
body{font-family:sans-serif;text-align:center;padding:2rem}
#qrimg{width:200px;height:200px}
</style></head>
<body>
<h1>网易云音乐扫码登录</h1>
<img id="qrimg" src="" alt="QR">
<p id="msg">正在生成二维码...</p>
<script>
async function gen(){
  const res=await fetch('/api/login/netease/qr',{method:'POST'});
  const data=await res.json();
  document.getElementById('qrimg').src=data.qr_url;
  document.getElementById('msg').innerText='请使用网易云音乐APP扫码';
  poll(data.key);
}
async function poll(key){
  const res=await fetch('/api/login/netease/poll',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`key=${key}`});
  const data=await res.json();
  if(data.status==='success'){
    document.getElementById('msg').innerText='登录成功，Cookie已保存';
  }else{
    setTimeout(()=>poll(key),2000);
  }
}
gen();
</script>
</body></html>
