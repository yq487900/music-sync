<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MusicSync{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v=30">
<meta name="theme-color" content="#0b0f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>
<div class="bg"><span class="blob a"></span><span class="blob b"></span><span class="blob c"></span></div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="dot"></span>
      <span>MusicSync<small>音乐同步控制台</small></span>
    </div>

      <a href="/" class="{{ 'active' if active == 'home' }}"{% if active == 'home' %} aria-current="page"{% endif %}>

        <span>首页</span>
      </a>
      <a href="/playlists" class="{{ 'active' if active == 'playlists' }}"{% if active == 'playlists' %} aria-current="page"{% endif %}>
        <span class="i"><svg viewBox="0 0 24 24"><path d="M3.5 6h10.5M3.5 12h10.5M3.5 18h6.5"/><path d="M18.5 15.2V6.6l3-0.9v8.6"/><circle cx="16.6" cy="15.8" r="1.9"/></svg></span>
        <span>歌单</span>
      </a>
      <a href="/download" class="{{ 'active' if active == 'download' }}"{% if active == 'download' %} aria-current="page"{% endif %}>
        <span class="i"><svg viewBox="0 0 24 24"><path d="M12 3.5v11.5"/><path d="M7.2 10.8 12 15.6l4.8-4.8"/><path d="M4.5 20h15"/></svg></span>
        <span>下载</span>
      </a>
      <a href="/organize" class="{{ 'active' if active == 'organize' }}"{% if active == 'organize' %} aria-current="page"{% endif %}>
        <span class="i"><svg viewBox="0 0 24 24"><path d="M12 3.6 13.6 8 18 9.6 13.6 11.2 12 15.6 10.4 11.2 6 9.6 10.4 8Z"/><path d="M18.4 15.2l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7Z"/></svg></span>

        <span>回收站</span>
      </a>
      <a href="/cloud" class="{{ 'active' if active == 'cloud' }}"{% if active == 'cloud' %} aria-current="page"{% endif %}>

        <span class="i"><svg viewBox="0 0 24 24"><path d="M3.5 7h9M18 7h2.5M3.5 17h3M11.5 17h9"/><circle cx="15.2" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></span>

    <button class="legend-btn" id="legend-btn" type="button" style="margin-top:auto">

  <main class="main">
    {% block content %}{% endblock %}

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 全局任务中心：右下角常驻，聚合下载 / 上传 / 刷削三个队列 -->
<button class="tc-fab" id="tc-fab" type="button" aria-expanded="false" aria-controls="tc-panel">
  <span class="tc-dot"></span><span id="tc-label">任务中心</span>
  <span class="tc-badge" id="tc-badge" hidden></span>
</button>
<div class="tc-panel" id="tc-panel" role="dialog" aria-label="全局任务中心">
  <div class="tc-h"><strong>任务中心</strong>
    <span><button class="btn mini" id="tc-refresh" type="button">刷新</button>
    <button class="btn mini" id="tc-close" type="button">关闭</button></span></div>
  <div class="tc-b" id="tc-body"></div>
</div>

<!-- 图标符号库：按钮里用 <svg><use href="#ic-xxx"/></svg> 引用，避免依赖 emoji 字体 -->

  <symbol id="ic-refresh" viewBox="0 0 24 24">
    <path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20.3 4.4v5.4h-5.4"/>
  </symbol>
  <symbol id="ic-down" viewBox="0 0 24 24">
    <path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19.5h14"/>
  </symbol>
  <symbol id="ic-up" viewBox="0 0 24 24">
    <path d="M12 20V9"/><path d="M7.5 13.5 12 9l4.5 4.5"/><path d="M5 4.5h14"/>
  </symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></symbol>
  <symbol id="ic-spark" viewBox="0 0 24 24">
    <path d="M11 3.5 12.5 8 17 9.5 12.5 11 11 15.5 9.5 11 5 9.5 9.5 8Z"/>
    <path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8Z"/>
  </symbol>
  <symbol id="ic-edit" viewBox="0 0 24 24">
    <path d="M4.5 19.5h4L19 9a2.1 2.1 0 0 0-3-3L5.5 16.5Z"/><path d="M14.5 7 17 9.5"/>
  </symbol>
  <symbol id="ic-trash" viewBox="0 0 24 24">
    <path d="M5 7h14"/><path d="M9.5 7V5h5v2"/><path d="M6.5 7l.8 12h9.4l.8-12"/><path d="M10.5 10.5v5M13.5 10.5v5"/>
  </symbol>
  <symbol id="ic-search" viewBox="0 0 24 24">
    <circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.5 15.5 20 20"/>
  </symbol>

  <!-- 云盘状态小云朵：云朵本体用 currentColor（由外面的 .ci-xxx 决定颜色），
       中间那个记号颜色写死在符号里（<use> 引用进来的内容没法用外部 CSS 上色） -->
  <symbol id="ic-cloud" viewBox="0 0 24 24">
    <path fill="currentColor" d="M6.8 18.6h9.9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.5-1.1A4.1 4.1 0 0 0 6.8 18.6Z"/>
  </symbol>
  <symbol id="ic-cloud-check" viewBox="0 0 24 24">
    <path fill="currentColor" d="M6.8 18.6h9.9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.5-1.1A4.1 4.1 0 0 0 6.8 18.6Z"/>
    <path fill="none" stroke="#15803d" stroke-width="2.6" stroke-linecap="round"
          stroke-linejoin="round" d="M9.7 14.5l1.9 1.9 3.2-3.8"/>
  </symbol>
  <symbol id="ic-cloud-alert" viewBox="0 0 24 24">
    <path fill="currentColor" d="M6.8 18.6h9.9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.5-1.1A4.1 4.1 0 0 0 6.8 18.6Z"/>
    <path fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"
          stroke-linejoin="round" d="M12 11.7v3.4M12 17.5h.01"/>
  </symbol>

  <!-- 无封面时的占位小音符 -->
  <symbol id="ic-note" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M9.4 17.4V6.3l9.2-2v11.1"/>
    <circle cx="7.1" cy="17.7" r="2.3" fill="currentColor"/>
    <circle cx="16.3" cy="15.6" r="2.3" fill="currentColor"/>
  </symbol>
  <!-- 网易云数据库里没有这首歌（所以云盘里也没封面）：禁止符号 -->
  <symbol id="ic-no-cover" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.1" fill="none" stroke="currentColor" stroke-width="1.9"/>
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M6.3 17.7 17.7 6.3"/>
  </symbol>
  <!-- 警告（下载/处理失败） -->
  <symbol id="ic-warn" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"
          d="M12 4.3 21 19.4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" d="M12 9.6v3.9M12 16.4h.01"/>
  </symbol>
  <!-- （此处曾重复定义 ic-up：id 必须唯一，浏览器只会用第一个，已删） -->
  <!-- 云盘歌曲是否在歌单里：白=在歌单；红+白感叹号=不在歌单；灰=认不出是哪首 -->
  <symbol id="ic-list" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          d="M3.6 6.6h10.8M3.6 11.6h10.8M3.6 16.6h7"/>
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          d="M18.7 5.9v9.2"/>
    <circle cx="16.7" cy="16.4" r="2.1" fill="currentColor"/>
    <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
          d="M18.7 6c1.3.2 2.3.7 2.9 1.5"/>
  </symbol>
  <symbol id="ic-list-out" viewBox="0 0 24 24">
    <path fill="none" stroke="#f87171" stroke-width="1.9" stroke-linecap="round"
          d="M3.6 6.6h10.8M3.6 11.6h10.8M3.6 16.6h7"/>
    <path fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"
          d="M18.7 7.2v4.4M18.7 15.4h.01"/>
  </symbol>

  <!-- 本地状态小软盘：普通 = 已在本地；带红感叹号 = 本地没有（未下载 / 下载失败） -->
  <symbol id="ic-disk" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round" d="M4.5 6.6A2.1 2.1 0 0 1 6.6 4.5h9.2L19.5 8.2v9.2a2.1 2.1 0 0 1-2.1 2.1H6.6a2.1 2.1 0 0 1-2.1-2.1Z"/>
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"
          d="M8.4 4.5v4.1h5.4V4.5"/>
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"
          d="M8.2 19.5v-4.6h7.6v4.6"/>
  </symbol>
  <symbol id="ic-disk-alert" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round" d="M4.5 6.6A2.1 2.1 0 0 1 6.6 4.5h9.2L19.5 8.2v9.2a2.1 2.1 0 0 1-2.1 2.1H6.6a2.1 2.1 0 0 1-2.1-2.1Z"/>
    <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"
          d="M8.4 4.5v4.1h5.4V4.5"/>
    <path fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round"
          d="M12 14.3v2.5M12 18.4h.01"/>
  </symbol>
</svg>
<script>
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 2800);
}
const FETCH_TIMEOUT = 20000;      // 默认 20s；长任务接口可传更大的值
/** 带超时与错误归一的基础请求：任何情况下都返回 {ok,status,data,error}，不抛异常 */
async function req(url, opts, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || FETCH_TIMEOUT);
  try {
    const res = await fetch(url, Object.assign({signal: ctl.signal}, opts || {}));
    let data = {};
    try { data = await res.json(); } catch (e) { data = {}; }
    return {ok: res.ok, status: res.status, data: data || {}};
  } catch (e) {
    const timeout = e && e.name === 'AbortError';
    return {ok: false, status: 0, data: {},
            error: timeout ? '请求超时（服务未响应）' : '网络请求失败（服务可能已停止）'};
  } finally {
    clearTimeout(timer);
  }
}
/** 向后兼容：返回 JSON 本体；失败时返回 {error}，使旧的 if (r.error) 分支仍然生效 */
async function post(url, data, ms) {
  const r = await req(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: data ? new URLSearchParams(data).toString() : ''
  }, ms);
  if (!r.ok && !(r.data && r.data.error)) {
    return Object.assign({}, r.data, {error: r.error || ('请求失败（HTTP ' + r.status + '）')});
  }
  return r.data;
}
async function jsonReq(url, method, body, ms) {
  return req(url, {
    method: method || 'GET',
    headers: body ? {'Content-Type': 'application/json'} : undefined,
    body: body ? JSON.stringify(body) : undefined
  }, ms);
}
/** 页面切到后台时自动跳过的定时器（回前台立即补跑一次） —— 避免后台标签页空转请求 */
function pollEvery(fn, ms) {
  const id = setInterval(() => { if (!document.hidden) fn(); }, ms);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fn(); });
  return id;
}
/** 按钮忙碌态：转圈 + 禁用（长操作时给明确反馈，而不是只是变淡） */
function setBusy(el, on) {
  if (!el) return;
  el.classList.toggle('loading', !!on);
  el.disabled = !!on;
}
/** 页面有未保存的输入时提醒（供跳转类快捷键使用） */
function hasDirtyForm() {
  const t = document.activeElement;
  return !!(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') && t.value && t.defaultValue !== undefined && t.value !== t.defaultValue);
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/**
 * 渲染分页控件
 * opts: {page, pages, total, size, sizes:[], onGo:(page,size)=>void, unit:'首'}
 */
function renderPager(el, opts) {
  const sizes = opts.sizes || [10, 20, 50, 100, 200, 500];
  const total = opts.total || 0;
  const from = total ? (opts.page - 1) * opts.size + 1 : 0;
  const to = Math.min(total, opts.page * opts.size);
  el.innerHTML = `
    <div class="info">共 ${total} ${opts.unit || '条'}${total ? `，当前 ${from}–${to}` : ''}</div>
    <div class="ctrl">
      <span class="lbl">每页</span>
      <select class="size">
        ${sizes.map(s => `<option value="${s}" ${s === opts.size ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
      <button class="btn" data-go="first" ${opts.page <= 1 ? 'disabled' : ''}>«</button>
      <button class="btn" data-go="prev" ${opts.page <= 1 ? 'disabled' : ''}>上一页</button>
      <span class="pg">${opts.page} / ${opts.pages || 1}</span>
      <button class="btn" data-go="next" ${opts.page >= (opts.pages || 1) ? 'disabled' : ''}>下一页</button>
      <button class="btn" data-go="last" ${opts.page >= (opts.pages || 1) ? 'disabled' : ''}>»</button>
    </div>`;
  el.querySelector('.size').onchange = (e) => opts.onGo(1, Number(e.target.value));
  el.querySelectorAll('button[data-go]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.go;
      const p = k === 'first' ? 1 : k === 'last' ? (opts.pages || 1)
        : k === 'prev' ? opts.page - 1 : opts.page + 1;
      if (p >= 1 && p <= (opts.pages || 1) && p !== opts.page) opts.onGo(p, opts.size);
    };
  });
}

/* ---------- 曲目行右侧的状态图标（歌单详情页 / 下载页共用） ---------- */
let CI = null;                      // 云盘索引状态（页面拿到接口数据后调 setCloudIndex）
function setCloudIndex(ci) { CI = ci || null; }

function cloudTip() {               // 悬停提示里带上「依据几点几分的数据」
  if (CI && CI.at) {
    const t = new Date(CI.at * 1000);
    const hh = String(t.getHours()).padStart(2, '0');
    const mm = String(t.getMinutes()).padStart(2, '0');
    return `（依据 ${hh}:${mm} 的云盘数据）`;
  }
  return '';
}

/** 简单弹窗：openModal(标题, 内容HTML) 返回遮罩元素（点背景/关闭按钮都能关） */
/**
 * 通用弹窗。
 * @param {string} title    标题
 * @param {string} bodyHtml 正文
 * @param {object} [opts] opts.noClose=true 时不渲染右上角「关闭」
 *   （正文自带「取消」的弹窗用它，避免两个关闭入口重复）
 */
function openModal(title, bodyHtml, opts) {
  const o = opts || {};
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal">
      <div class="modal-h"><strong>${esc(title)}</strong>`
    + (o.noClose ? '' : '<button class="btn mini" data-m="close">关闭</button>')
    + `</div>
      <div class="modal-b">${bodyHtml}</div>
    </div>`;
  document.body.appendChild(back);
  // 必须用 querySelectorAll：正文里也可能有 data-m="close"（如转存弹窗的「取消」）。
  // 原来用 querySelector 只绑了第一个（头部的「关闭」），导致正文那个点了没反应。
  back.querySelectorAll('[data-m=close]').forEach((b) => { b.onclick = () => back.remove(); });
  back.onclick = (e) => { if (e.target === back) back.remove(); };
  return back;
}

/** 没有封面时的占位块（内联 SVG，不用 emoji）；cls 默认 cov，歌单头图那里传 cover */
function phBox(icon, tip, cls) {
  const c = cls || 'cov';
  return `<span class="${c} ph"${tip ? ` title="${esc(tip)}"` : ''}>`
    + `<svg class="ci-ph"><use href="#${icon}"/></svg></span>`;
}

/** 本地状态：💾 = 已在本地；💾+红感叹号 = 本地没有（悬停看是未下载还是下载失败） */
/** 状态图标：带 title（桌面悬停）+ data-tip（触屏点击弹提示） */
function iconTip(cls, tip, sym) {
  const safe = esc(tip);
  // sym 必须显式传：class 名与 symbol id 并非一一对应
  // （ci-in 对应 ic-cloud / ic-cloud-check 两个；ci-out → ic-cloud-alert）
  return '<svg class="ci-icon ' + cls + '" role="img" tabindex="0" data-tip="' + safe + '">'
    + '<title>' + safe + '</title><use href="#' + (sym || cls.replace(/^ci-/, 'ic-')) + '"/></svg>';
}
function localCell(t) {
  if (t.local) return iconTip('ci-disk', '已在本地', 'ic-disk');
  if (t.status === 'failed') return iconTip('ci-disk-alert', '下载失败' + (t.error ? '：' + t.error : ''), 'ic-disk-alert');
  return iconTip('ci-disk-alert', '还没下载到本地', 'ic-disk-alert');
}

/** 云盘状态：白云=在云盘；白云+绿勾=在云盘且本地已有；红云+白感叹号=不在云盘；灰云=未知 */
/** 曲目在本地库的自增 id：下载页给的是 id，歌单页给的是 track_id，两个都要认 */
function trackKey(t) {
  const a = (t.id != null && t.id !== 0 && t.id !== '') ? t.id : null;
  if (a != null) return a;
  return (t.track_id != null && t.track_id !== 0 && t.track_id !== '') ? t.track_id : null;
}
function cloudCell(t) {
  const tip = cloudTip();
  if (t.in_cloud === true) {
    return t.local ? iconTip('ci-in', '在云盘，本地也有' + tip, 'ic-cloud-check')
                   : iconTip('ci-in', '在云盘（本地还没下载）' + tip, 'ic-cloud');
  }
  if (t.in_cloud === false) {
    const tid = trackKey(t);
    if (tid == null) {
      // 这首歌还没进本地曲库（歌单页里 track_id=0）→ 说清楚下一步该干什么
      return iconTip('ci-out',
        '不在云盘；这首歌还没同步到本地曲库 —— 请先在歌单页点「同步」' + tip, 'ic-cloud-alert');
    }
    return '<svg class="ci-icon ci-out ci-clickable" role="button" tabindex="0"'
      + ' data-cloud-add="' + tid + '" data-cloud-local="' + (t.local ? '1' : '') + '"'
      + ' data-cloud-title="' + esc(t.title || '') + '">'
      + '<title>不在云盘' + tip + ' —— 点一下可立即' + (t.local ? '上传' : '下载并转存') + '到云盘</title>'
      + '<use href="#ic-cloud-alert"/></svg>';
  }
  return iconTip('ci-unknown', '云盘数据读取中，稍后自动刷新', 'ic-cloud');
}

/** 在不在（网易云）歌单里：白=在；红+白感叹号=不在；灰=认不出是哪首（没法判断） */
function playlistCell(t) {
  if (t.in_playlist === true) return iconTip('ci-list', '在你的歌单里', 'ic-list');
  if (t.in_playlist === false) {
    return '<svg class="ci-icon ci-list ci-clickable" data-addpl="1" role="button" tabindex="0">'
      + '<title>不在你的任何歌单里 —— 点一下可以加到歌单</title>'
      + '<use href="#ic-list-out"/></svg>';
  }
  return iconTip('ci-unknown', '认不出这是哪首歌（云盘条目还没匹配到正式曲目），判断不了在不在歌单里', 'ic-list');
}

/* ---------- 筛选片 ---------- */
/** 点筛选片：同组单选，组间叠加。状态存在 state.xxx，值写在片子的 data-v 上 */
function bindChips(group, state, onChange) {
  const box = document.getElementById(group);
  if (!box) return;
  box.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => {
      state[chip.dataset.k] = chip.dataset.v;
      state.page = 1;
      onChange();
    };
  });
}
/** 按 counts 刷新筛选片上的数字和选中态 */
function paintChips(group, state, counts) {
  const box = document.getElementById(group);
  if (!box) return;
  box.querySelectorAll('.chip').forEach(chip => {
    chip.classList.toggle('on', state[chip.dataset.k] === chip.dataset.v);
    const n = chip.querySelector('.n');
    if (n) n.textContent = counts && counts[chip.dataset.n] != null ? counts[chip.dataset.n] : '';
  });
}
/* ================= 新增：状态图标图例 ================= */
// [class, symbol, 名称, 说明]
// symbol 必须显式写：class 名与 symbol id 不是一一对应
const LEGEND = [
  ['ci-disk', 'ic-disk', '已在本地', '这首歌已经下载到本地曲库'],
  ['ci-disk-alert', 'ic-disk-alert', '本地没有', '还没下载，或下载失败（悬停/点击看具体原因）'],
  ['ci-in', 'ic-cloud', '在云盘', '已上传到网易云云盘（本地可能还没下载）'],
  ['ci-in', 'ic-cloud-check', '在云盘且本地也有', '既在云盘，本地也已经下载好'],
  ['ci-out', 'ic-cloud-alert', '不在云盘', '云盘里还没有这首歌 —— 点一下可以立即下载并转存'],
  ['ci-list', 'ic-list', '在歌单里', '这首歌在你的（已勾选的）歌单里'],
  ['ci-list-out', 'ic-list-out', '不在歌单', '不在任何歌单里 —— 点一下可加到歌单'],
  ['ci-unknown', 'ic-cloud', '判断不了', '云盘条目还没匹配到正式曲目，认不出是哪首歌'],
];
function openLegend() {
  const body = '<div class="legend">' + LEGEND.map(function (x) {
    return '<div class="lg-row"><svg class="ci-icon ' + x[0] + '" role="img">'
      + '<use href="#' + x[1] + '"/></svg>'
      + '<div><b>' + x[2] + '</b><small>' + x[3] + '</small></div></div>';
  }).join('') + '</div>'
    + '<p class="hint" style="margin-top:16px">小图标尺寸固定、排成一竖线，所以每一列都能上下对比。'
    + '触屏设备点一下图标也会弹提示（悬停提示在手机上无法触发）。</p>';
  openModal('状态图标图例', body);
}

/* ================= 新增：全局任务中心 ================= */
const TC_Q = [
  {k: 'download', name: '下载', href: '/download', unit: '首'},
  {k: 'upload',   name: '上传云盘', href: '/cloud', unit: '首'},
  {k: 'organize', name: '刷削整理', href: '/organize', unit: '首'},
];
let tcOpenNew = false;
let TC_OPEN = {};      // 各队列是否展开（key = download/upload/organize）
let TC_LAST = null;    // 最后一次 /api/status 数据（展开/收起时直接重渲染，不再请求）
/** 字节格式化（base 内用；避免与各页自己的 fmtSize 撞名） */
function fmtBytes(n) {
  n = Number(n) || 0;
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i += 1; }
  return (i ? v.toFixed(i >= 3 ? 2 : 1) : String(v)) + ' ' + u[i];
}
/** 队列里的任务明细（歌名 + 状态 + 实际进度） */
function tcTasksHtml(tasks) {
  if (!tasks.length) return '<div class="tc-tasks"><small>暂无任务</small></div>';
  const label = {queued: '排队中', downloading: '下载中', paused: '已暂停',
                 done: '已完成', failed: '失败', canceled: '已取消'};
  const list = tasks.slice(0, 30).map(function (t) {
    const st = label[t.state] || t.state;
    const pct = (t.percent != null) ? t.percent : 0;
    const cls = t.state === 'failed' ? ' f' : (t.state === 'done' ? ' d'
              : (t.state === 'downloading' ? ' g' : ''));
    return '<div class="tc-task' + cls + '">'
      + '<div class="tc-task-t"><span class="tc-task-n">'
      + esc(t.title || ('#' + t.track_id)) + '</span>'
      + '<span class="tc-task-s">' + st
      + (t.state === 'downloading' && t.total ? ' ' + pct + '%' : '') + '</span></div>'
      + (t.artist ? '<small>' + esc(t.artist) + '</small>' : '')
      + (t.state === 'downloading'
          ? '<div class="tc-bar sm"><i style="width:' + (t.total ? pct : 0) + '%"></i></div>'
          : (t.total ? '<div class="tc-bar sm"><i style="width:' + pct + '%"></i></div>' : ''))
      + (!t.total && t.done ? '<small>已下载 ' + fmtBytes(t.done) + '</small>' : '')
      + (t.error ? '<small class="tc-err">' + esc(String(t.error).slice(0, 70)) + '</small>' : '')
      + '</div>';
  }).join('');
  return '<div class="tc-tasks">' + list
    + (tasks.length > 30 ? '<small>仅显示最近 30 条</small>' : '') + '</div>';
}
function tcRender(s) {
  TC_LAST = s;
  const q = (s && s.queues) || {};
  const rows = TC_Q.map(function (d) {
    const o = q[d.k] || {};
    const done = o.done || 0, failed = o.failed || 0;
    const left = (o.queued || 0) + (o.downloading || 0);
    const total = done + failed + left;
    const pct = total ? Math.round((done + failed) * 100 / total) : 0;
    return {d: d, o: o, done: done, failed: failed, left: left, total: total, pct: pct};
  });
  const active = rows.filter(function (r) { return r.o.busy || r.left; });
  const failedAll = rows.reduce(function (a, r) { return a + r.failed; }, 0);
  const running = !!(s && s.running);

  // FAB 状态
  const fab = document.getElementById('tc-fab');
  const lbl = document.getElementById('tc-label');
  if (fab) {
    fab.classList.toggle('busy', active.length > 0 || running);
    fab.classList.toggle('err', active.length === 0 && !running && failedAll > 0);
  }
  // FAB 右上角数字角标：正在进行（下载中 + 排队）的任务数
  const doingCount = rows.reduce(function (a, r) {
    return a + (r.o.downloading || 0) + (r.o.queued || 0);
  }, 0);
  const badge = document.getElementById('tc-badge');
  if (badge) {
    badge.hidden = !doingCount;
    badge.textContent = doingCount > 99 ? '99+' : String(doingCount || '');
  }
  if (lbl) {
    lbl.textContent = running ? '任务运行中'
      : active.length ? (active.length + ' 个队列进行中')
      : failedAll ? ('任务中心 · ' + failedAll + ' 失败')
      : '任务中心';
  }

  // 面板内容
  const box = document.getElementById('tc-body');
  if (!box) return;
  const idleAll = !rows.some(function (r) { return r.total; }) && !running;
  box.innerHTML = rows.map(function (r) {
    const busy = r.o.busy || r.left;
    const open = !!TC_OPEN[r.d.k];
    const sub = r.total
      ? ('完成 ' + r.done + ' · 失败 ' + r.failed + ' · 待处理 ' + r.left)
      : '空闲';
    return '<div class="tc-row' + (busy ? ' doing' : '') + (open ? ' open' : '') + '"'
      + ' data-tcexp="' + r.d.k + '" role="button" tabindex="0"'
      + ' aria-expanded="' + (open ? 'true' : 'false') + '"'
      + ' title="点一下展开 / 收起歌曲明细">'
      + '<div class="tc-top">'
      + '<span class="tc-t">' + r.d.name + '</span>'
      + '<span class="tc-n">' + r.done + '/' + r.total + ' ' + r.d.unit + '</span></div>'
      + '<small>' + sub + '</small>'
      + (r.total ? '<div class="tc-bar"><i style="width:' + r.pct + '%"></i></div>' : '')
      + (open ? tcTasksHtml(((r.o.tasks) || []).slice().reverse()) : '')
      + (r.failed ? '<div class="btn-row" style="margin-top:8px">'
          + '<a class="btn mini" href="' + r.d.href + '">查看 ' + r.failed + ' 个失败</a></div>' : '')
      + '</div>';
  }).join('')
  + (idleAll ? '<div class="hint" style="margin-top:10px;text-align:center">'
      + '当前没有排队中的任务。可到首页「手动操作」发起同步或下载。</div>' : '')
  + (failedAll ? '<div class="btn-row" style="margin-top:10px">'
      + '<a class="btn mini" href="/download?filter=failed">失败重试中心</a></div>' : '');
}
async function tcPoll() {
  const r = await jsonReq('/api/status');
  if (!r.ok) {
    const box = document.getElementById('tc-body');
    if (box && box.classList.contains('tc-open-err')) { /* 保留已有内容 */ }
    if (box) box.innerHTML = '<div class="tc-empty">'
      + esc(r.error || '状态读取失败') + '<br><span class="hint">服务可能正在重启</span></div>';
    const fab = document.getElementById('tc-fab');
    if (fab) fab.classList.add('err');
    return;
  }
  tcRender(r.data);
}
function tcToggle(open) {
  const p = document.getElementById('tc-panel');
  const f = document.getElementById('tc-fab');
  if (!p) return;
  tcOpenNew = (open === undefined) ? !p.classList.contains('show') : !!open;
  p.classList.toggle('show', tcOpenNew);
  if (f) f.setAttribute('aria-expanded', tcOpenNew ? 'true' : 'false');
  if (tcOpenNew) tcPoll();
}
document.getElementById('tc-fab').onclick = function () { tcToggle(); };
document.getElementById('tc-refresh').onclick = function () { tcPoll(); toast('已刷新', 'ok'); };
document.getElementById('tc-close').onclick = function () { tcToggle(false); };
document.getElementById('legend-btn').onclick = openLegend;

/* 任务中心：展开 / 收起某个队列的歌曲明细（用缓存数据重渲染，不重新请求） */
document.addEventListener('click', function (e) {
  const b = e.target.closest && e.target.closest('[data-tcexp]');
  if (!b) return;
  // 行内的按钮 / 链接（如「查看 N 个失败」）不应当把行展开/收起
  if (e.target.closest && e.target.closest('a, button')) return;
  const k = b.getAttribute('data-tcexp');
  TC_OPEN[k] = !TC_OPEN[k];
  if (TC_LAST) tcRender(TC_LAST);
});

/* 云盘图标（不在云盘）→ 立即下载并转存云盘；本地已有则直接上传 */
document.addEventListener('click', function (e) {
  const el = e.target.closest && e.target.closest('[data-cloud-add]');
  if (!el) return;
  e.preventDefault();
  const tid = el.getAttribute('data-cloud-add');
  const title = el.getAttribute('data-cloud-title') || ('#' + tid);
  const local = el.getAttribute('data-cloud-local') === '1';
  const back = openModal('转存到网易云云盘', ''
    + '<div style="padding:6px 2px">'
    + '<p style="margin:0 0 4px;font-size:14.5px"><strong>' + esc(title) + '</strong></p>'
    + '<p style="margin:0 0 18px;color:var(--text-dim);font-size:13px;line-height:1.7">'
    + (local ? '这首歌已在本地，是否立即上传到云盘？'
              : '这首歌不在云盘。是否立即下载，并在下载完成后自动转存到云盘？')
    + '</p>'
    + '<div class="btn-row" style="margin-top:0;justify-content:flex-end">'
    + '<button class="btn" data-m="close">取消</button>'
    + '<button class="btn primary" data-m="go">'
    + (local ? '上传到云盘' : '下载并转存') + '</button>'
    + '</div></div>', {noClose: true});
  back.querySelector('[data-m=go]').onclick = async function () {
    const btn = this;
    setBusy(btn, true);
    try {
      if (local) {
        const r = await jsonReq('/api/cloud/upload/' + tid, 'POST');
        toast(r.ok ? '已加入上传队列' : (r.data.error || r.error || '上传入队失败'), r.ok ? 'ok' : 'err');
      } else {
        const r = await jsonReq('/api/tracks/' + tid + '/download', 'POST', {to_cloud: true});
        toast(r.ok ? '已加入下载队列，完成后自动转存云盘'
                   : (r.data.error || r.error || '下载入队失败'), r.ok ? 'ok' : 'err');
      }
      back.remove();
    } finally { setBusy(btn, false); }
  };
});

/* 全局：点击带 data-tip 的状态图标 → 弹提示（触屏无法悬停）；关后台→暂停轮询 */
document.addEventListener('click', function (e) {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el && !el.classList.contains('ci-clickable')) toast(el.getAttribute('data-tip'));
});

/* 键盘快捷键：/ 聚焦搜索    ? 图例    Esc 关闭弹层 */
document.addEventListener('keydown', function (e) {
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
  if (e.key === 'Escape') {
    const p = document.getElementById('tc-panel');
    if (p && p.classList.contains('show')) { tcToggle(false); return; }
    const mb = document.querySelector('.modal-back');
    if (mb) mb.remove();
    return;
  }
  if (typing) return;
  if (e.key === '/') {
    const s = document.querySelector('.searchbar input, input[type=search]');
    if (s) { e.preventDefault(); s.focus(); }
  } else if (e.key === '?') { e.preventDefault(); openLegend(); }
});

/* 任务中心轮询：2.5 秒。必须常驻且足够快 —— 否则新任务加入时，
   按钮右上角的数字角标要等到用户点开面板才更新 */
pollEvery(tcPoll, 2500);
</script>
{% block script %}{% endblock %}
</body>
</html>
