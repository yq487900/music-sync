[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; 控制接口：docker compose exec music-sync supervisorctl status
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; 网易云接口服务（仅本机回环，不对外暴露）
[program:ncm-api]
command=node /opt/ncm-api/node_modules/@neteasecloudmusicapienhanced/api/app.js
; TMPDIR 放到 /data 下持久化：这个接口服务把「匿名 token / xeapi 公钥」缓存在临时目录里，
; 用默认的 /tmp 时每次容器重建都要重新去上游拉，遇上上游慢就会几分钟不监听端口（页面 502）
environment=HOST="127.0.0.1",PORT="3000",TMPDIR="/data/ncm-tmp",http_proxy="",https_proxy="",HTTP_PROXY="",HTTPS_PROXY="",no_proxy="",NO_PROXY=""
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; 洛雪兼容音源脚本沙箱
[program:lx-runner]
command=node /app/sources/runner.js
environment=LX_HOST="127.0.0.1",LX_PORT="3100"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Web 界面 + 同步引擎
[program:musicsync]
command=uvicorn app.main:app --host 0.0.0.0 --port 13570
directory=/app
environment=PATH="/opt/venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
