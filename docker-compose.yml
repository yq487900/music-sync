version: "3.9"

services:
  musicsync:
    image: ghcr.io/yq487900/music-sync:latest
    container_name: music-sync
    ports:
      - "${APP_PORT:-13570}:13570"
    volumes:
      - musicsync_data:/data
      - ${MUSIC_DIR:-/mnt/music}:/music
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

volumes:
  musicsync_data: