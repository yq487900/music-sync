version: "3.9"

# --------------------------------------------------------------
# MusicSync 多模式部署
# 使用方式：
#   基础版          docker compose up -d
#   生产版(含Nginx)  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   开发版(热重载)   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   仅数据库/迁移     docker compose run --rm migrate
# --------------------------------------------------------------

services:
  # ---------- 核心应用 ----------
  musicsync:
    build:
      context: .
      dockerfile: Dockerfile
    image: music-sync:local
    container_name: music-sync-app
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - musicsync_data:/data
      - ${MUSIC_DIR:-/mnt/music}:/music
      - ${CONFIG_DIR:-./config}:/config:ro
    environment:
      - DOWNLOAD_DIR=/music
      - NEED_SCRAPE_DIR=/music/need_scrape
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Asia/Shanghai}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - musicsync_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ---------- 反向代理 & SSL (生产模式启用) ----------
  nginx:
    profiles: ["prod"]
    image: nginx:alpine
    container_name: music-sync-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - musicsync
    restart: unless-stopped
    networks:
      - musicsync_net

  # ---------- Certbot 自动续期 (生产模式) ----------
  certbot:
    profiles: ["prod"]
    image: certbot/certbot
    container_name: music-sync-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet || true; sleep 12h & wait $${!}; done"
    networks:
      - musicsync_net

  # ---------- 开发热重载 ----------
  musicsync-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: music-sync:dev
    container_name: music-sync-dev
    ports:
      - "${DEV_PORT:-8001}:8000"
    volumes:
      - musicsync_data:/data
      - ${MUSIC_DIR:-/mnt/music}:/music
      - ./app:/app:ro
      - ./templates:/app/templates:ro
    environment:
      - DOWNLOAD_DIR=/music
      - PYTHONUNBUFFERED=1
      - DEBUG=1
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - musicsync_net

  # ---------- 一次性数据库迁移/初始化 ----------
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    image: music-sync:local
    container_name: music-sync-migrate
    volumes:
      - musicsync_data:/data
      - ${MUSIC_DIR:-/mnt/music}:/music
    environment:
      - DOWNLOAD_DIR=/music
    env_file:
      - .env
    command: python -c "from app.db.models import Base, engine; Base.metadata.create_all(engine); print('DB initialized')"
    networks:
      - musicsync_net

volumes:
  musicsync_data:
    driver: local

networks:
  musicsync_net:
    driver: bridge
    name: musicsync_network