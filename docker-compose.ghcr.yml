# 直接用已发布的镜像跑（不需要源码、不需要构建工具）
#   cp .env.example .env && docker compose -f docker-compose.ghcr.yml up -d
# 想自己构建源码：用 docker-compose.yml（build: .）
services:
  musicsync:
    image: ghcr.io/yq487900/music-sync:latest
    container_name: music-sync
    ports:
      - "${APP_PORT:-13570}:13570"
    volumes:
      - musicsync_data:/data
      # 三个音乐目录各自独立映射（详见 docker-compose.yml 里的说明）
      - ${MUSIC_DOWNLOAD_DIR:-/mnt/music/download}:/music/download
      - ${MUSIC_LIBRARY_DIR:-/mnt/music/musics}:/music/musics
      - ${MUSIC_TRASH_DIR:-/mnt/music/_trash}:/music/_trash
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

volumes:
  musicsync_data:
